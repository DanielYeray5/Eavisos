version: '3.8'

services:
  # --- Servicios de Infraestructura ---

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    ports:
      - "${MQTT_PORT:-1883}:${MQTT_PORT:-1883}"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    volumes:
      - redis-data:/data

  postgres-master:
    image: postgres:14-alpine
    container_name: postgres-master
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_MASTER:-5432}:5432"
    volumes:
      - postgres-master-data:/var/lib/postgresql/data

  postgres-replica:
    image: postgres:14-alpine
    container_name: postgres-replica
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGHOST: postgres-master
      POSTGRES_INITDB_ARGS: "--no-sync"
    command: >
      bash -c "
        rm -rf /var/lib/postgresql/data/* &&
        until pg_basebackup --pgdata=/var/lib/postgresql/data -R --slot=replication_slot --host=postgres-master -U ${DB_USER}; do
          echo 'Esperando al maestro...'
          sleep 1
        done &&
        chmod 0700 /var/lib/postgresql/data &&
        postgres
      "
    ports:
      - "${DB_PORT_REPLICA:-5433}:5432"
    depends_on:
      - postgres-master
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data

  # --- Microservicios de la Aplicación ---

  ms-recepcion-alertas-1: &ms-recepcion-alertas-base
    build: ./services/ms-recepcionAlertas
    environment:
      MQTT_URL: mqtt://mqtt-broker:${MQTT_PORT:-1883}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      - mqtt-broker
      - redis

  ms-recepcion-alertas-2:
    <<: *ms-recepcion-alertas-base

  ms-recepcion-alertas-3:
    <<: *ms-recepcion-alertas-base

  ms-geolocalizacion:
    build: ./services/ms-geolocalizacion
    environment:
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      - redis

  ms-prioridad:
    build: ./services/ms-prioridad
    environment:
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      - redis

  ms-notificaciones:
    build: ./services/ms-notificaciones
    ports:
      - "${MS_NOTIFICACIONES_PORT:-3004}:${MS_NOTIFICACIONES_PORT:-3004}"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      APP_PORT: ${MS_NOTIFICACIONES_PORT:-3004}
    depends_on:
      - redis

  ms-historial:
    build: ./services/ms-historial
    ports:
      - "${MS_HISTORIAL_PORT:-3005}:${MS_HISTORIAL_PORT:-3005}"
    environment:
      DB_HOST_MASTER: postgres-master
      DB_HOST_REPLICA: postgres-replica
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT_MASTER: 5432
      DB_PORT_REPLICA: 5432 # Dentro de docker, el puerto es el estándar
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      APP_PORT: ${MS_HISTORIAL_PORT:-3005}
    depends_on:
      - postgres-master
      - postgres-replica
      - redis

  # --- Balanceador de Carga ---

  nginx-balancer:
    image: nginx:1.21-alpine
    container_name: nginx-balancer
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ms-recepcion-alertas-1
      - ms-recepcion-alertas-2
      - ms-recepcion-alertas-3

volumes:
  redis-data:
  postgres-master-data:
  postgres-replica-data:
  mosquitto-config:
  mosquitto-data:
  mosquitto-log: